name: Selenium Hub Setup and Test

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Selenium Hub container
        run: |
          docker run -d -p 4444:4444 --name selenium-hub selenium/hub:4.10.0
          echo "Selenium Hub container started."

      - name: Check if Selenium Hub is running
        run: |
          docker ps
          CONTAINER_ID=$(docker ps -q --filter ancestor=selenium/hub)
          if [ -n "$CONTAINER_ID" ]; then
            echo "Selenium Hub is running."
            docker logs "$CONTAINER_ID"
          else
            echo "Selenium Hub is not running!"
            exit 1
          fi
      

      - name: Check if port 4444 is accessible
        run: |
          nc -zv 127.0.0.1 4444 || exit 1
          echo "Port 4444 is open"

      - name: Set up Selenium Node (Chrome)
        run: |
          docker run -d --name selenium-node-chrome --link selenium-hub:hub selenium/node-chrome:4.10.0
          echo "Selenium Chrome Node started and linked to Hub."

      - name: Wait for Selenium Hub to be ready
        run: |
          for i in {1..60}; do
            if curl -sSL "http://localhost:4444/status" | grep '"ready":true'; then
              echo "Selenium Hub is ready!"
              exit 0
            fi
            echo "Waiting for Selenium Hub... Attempt $i"
            sleep 10
          done
          echo "Selenium Hub did not start in time"
          exit 1

      - name: Show Docker logs for troubleshooting
        run: |
          docker logs $(docker ps -q --filter ancestor=selenium/hub)

      # Крок 7: Збір звітів з тестів (якщо вони є)
      - name: Upload cucumber reports
        run: |
          if [ -f "target/cucumber-report.json" ]; then
            echo "Uploading cucumber report"
            actions/upload-artifact@v4:
              name: cucumber-reports
              path: target/cucumber-report.json
              if-no-files-found: warn
          else
            echo "No cucumber report found."
          fi