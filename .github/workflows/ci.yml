name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    services:
      selenium-hub:
        image: selenium/hub:4.10.0
        ports:
          - 4444:4444

      chrome-node:
        image: selenium/node-chrome:4.10.0
        options: "--shm-size=2g"
        env:
          SE_EVENT_BUS_HOST: selenium-hub
          SE_EVENT_BUS_PUBLISH_PORT: 4442
          SE_EVENT_BUS_SUBSCRIBE_PORT: 4443

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for Selenium Hub to be ready
        run: |
          for i in {1..30}; do
            if curl -sSf http://localhost:4444/wd/hub/status | grep -q '"ready":true'; then
              echo "Selenium Hub is ready"
              exit 0
            fi
            echo "Waiting for Selenium Hub..."
            sleep 2
          done
          echo "Selenium Hub did not start in time" >&2
          exit 1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven cache
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2

      - name: Build with Maven
        run: mvn clean install -DskipTests

      - name: Run Checkstyle
        run: mvn checkstyle:check

      - name: Run Cucumber Tests
        env:
          HOST: ${{ secrets.TEST_HOST }}
          REMOTE_URL: http://localhost:4444/wd/hub
          RUN_MODE: remote
          HEADLESS_MODE: true
        run: mvn test -Dcucumber.options="--plugin json:target/cucumber-report.json"

      - name: Upload Cucumber Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: cucumber-reports
          path: target/cucumber-report.json